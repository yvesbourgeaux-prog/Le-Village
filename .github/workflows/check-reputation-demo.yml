name: Check private reservation demo
on:
  push:
    paths:
      - 'demo-reservation.php'
      - 'tools/check-demo-reservation.cjs'
      - '.github/workflows/check-reputation-demo.yml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: |
          php -l demo-reservation.php
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/demo-reservation.js
      - name: Check booking regression
        run: node tools/check-demo-reservation.cjs
