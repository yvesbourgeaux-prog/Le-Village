<style>
    body {
      background-color: #fcf9f3;
      color: #713506;
      margin: 0;
    }

    .press-header-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 1px;
      background: rgba(113, 53, 6, 0.28);
      pointer-events: none;
      z-index: 0;
    }

    .header-safe {
      position: relative;
      z-index: 20;
    }

    .header-safe a,
    .header-safe button {
      position: relative;
      z-index: 30;
      pointer-events: auto;
    }

    /* --- COLLAGE STYLE "NEGRESCO" (IMAGES ENTIÈRES) --- */
    .collage-container {
      position: relative;
      width: 100%;
      max-width: 1050px;
      margin: 0 auto;
      aspect-ratio: 2 / 1; /* Format large pour laisser de l'espace aux photos */
    }

    .collage-photo {
      position: absolute;
      display: block;
      box-shadow: 0 10px 40px -10px rgba(113, 53, 6, 0.15); /* Ombre douce et élégante */
      transition: transform 0.4s ease;
      will-change: transform;
      user-select: none;
      -webkit-user-drag: none;
      /* Ajout du style tirage photo */
      background-color: #ffffff;
      padding: 8px 8px 24px 8px;
    }

    .collage-photo img {
      width: 100%;
      height: auto; /* Permet à l'image de s'afficher en entier sans être coupée */
      display: block;
    }

    .collage-photo:hover {
      transform: scale(1.05) translateY(-5px) !important;
      z-index: 10 !important;
      box-shadow: 0 20px 50px -12px rgba(113, 53, 6, 0.30);
    }

    /* 
       Répartition mathématique (100% de largeur) sans superposition :
       Gauche: 0% à 26%
       Espace: 4%
       Centre: 30% à 68%
       Espace: 4%
       Droite: 72% à 100%
    */

    .img-left {
      top: 20%;
      left: 0%;
      width: 26%;
      transform: rotate(-3deg);
      z-index: 2;
    }

    .img-center {
      top: 0%;
      left: 30%;
      width: 38%;
      transform: rotate(2deg);
      z-index: 1;
    }

    .img-right {
      top: 35%;
      left: 72%;
      width: 28%;
      transform: rotate(-2deg);
      z-index: 3;
    }

    @media (max-width: 991px) {
      .collage-container {
        max-width: 760px;
        aspect-ratio: 16 / 12;
      }
    }

    @media (max-width: 767px) {
      /* Sur mobile, on désactive l'absolu pour un affichage propre en colonne */
      .collage-container {
        aspect-ratio: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3rem;
        padding-bottom: 2rem;
      }
      .collage-photo {
        position: relative;
        top: auto !important;
        left: auto !important;
        right: auto !important;
        width: 85% !important;
      }
      .img-left { transform: rotate(-2deg); }
      .img-center { transform: rotate(2deg); }
      .img-right { transform: rotate(-2deg); }
    }
